<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cálculo Integral | Sumas de Riemann</title>

<!-- FUENTES -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<!-- PLOTLY -->

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

/* ===== GENERAL ===== */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top left,#17376e,#081426 60%);

    color:white;

    font-family:'Inter',sans-serif;

    min-height:100vh;

    overflow-x:hidden;
}

/* ===== HEADER ===== */

header{

    width:100%;

    padding:25px 40px;

    border-bottom:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);
}

header h1{

    font-family:'Space Grotesk',sans-serif;

    font-size:40px;

    color:#7fd8ff;

    letter-spacing:2px;

    text-shadow:0px 0px 12px rgba(127,216,255,0.4);
}

header p{

    margin-top:10px;

    color:#c7d7ea;

    font-size:18px;
}

/* ===== CONTENEDOR PRINCIPAL ===== */

.main{

    display:flex;

    width:100%;

    min-height:calc(100vh - 120px);
}

/* ===== PANEL IZQUIERDO ===== */

.sidebar{

    width:360px;

    background:rgba(10,20,35,0.82);

    border-right:1px solid rgba(255,255,255,0.08);

    padding:30px;

    backdrop-filter:blur(12px);
}

.sidebar h2{

    font-family:'Space Grotesk',sans-serif;

    color:#7fd8ff;

    margin-bottom:25px;

    font-size:28px;
}

/* ===== CAMPOS ===== */

.campo{

    margin-bottom:22px;
}

.campo label{

    display:block;

    margin-bottom:10px;

    color:#9ecbff;

    font-weight:600;

    font-size:15px;
}

input,
select{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:#10243d;

    color:white;

    font-size:16px;

    outline:none;

    transition:0.3s;

    border:1px solid transparent;
}

input:focus,
select:focus{

    border:1px solid #4fc3f7;

    box-shadow:0px 0px 15px rgba(79,195,247,0.4);
}

/* ===== SLIDER ===== */

.slider-container{

    margin-top:8px;
}

.slider-value{

    margin-top:8px;

    color:#7fd8ff;

    font-weight:bold;

    font-size:18px;
}

input[type="range"]{

    appearance:none;

    height:8px;

    background:#1d3a63;

    border-radius:10px;

    padding:0;
}

input[type="range"]::-webkit-slider-thumb{

    appearance:none;

    width:22px;

    height:22px;

    border-radius:50%;

    background:#4fc3f7;

    cursor:pointer;

    box-shadow:0px 0px 12px rgba(79,195,247,0.7);
}

/* ===== BOTONES ===== */

.botones{

    display:flex;

    flex-direction:column;

    gap:14px;

    margin-top:30px;
}

button{

    padding:15px;

    border:none;

    border-radius:14px;

    background:linear-gradient(135deg,#1976d2,#42a5f5);

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    font-family:'Inter',sans-serif;

    box-shadow:0px 0px 18px rgba(66,165,245,0.25);
}

button:hover{

    transform:translateY(-2px);

    box-shadow:0px 0px 22px rgba(66,165,245,0.45);
}

/* ===== RESULTADOS ===== */

.resultados{

    margin-top:35px;

    padding:20px;

    background:rgba(255,255,255,0.04);

    border-radius:18px;

    border:1px solid rgba(255,255,255,0.05);
}

.resultados h3{

    color:#7fd8ff;

    margin-bottom:18px;

    font-family:'Space Grotesk',sans-serif;
}

.resultado-item{

    margin-bottom:16px;

    line-height:1.7;
}

.resultado-titulo{

    color:#9ecbff;

    font-weight:600;
}

.resultado-valor{

    font-size:20px;

    color:white;

    font-weight:bold;
}

/* ===== PANEL DERECHO ===== */

.content{

    flex:1;

    padding:25px;
}

/* ===== TARJETA SUPERIOR ===== */

.formula-box{

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.06);

    border-radius:18px;

    padding:18px 25px;

    margin-bottom:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:90px;

    backdrop-filter:blur(10px);
}

.formula{

    font-size:28px;

    color:#7fd8ff;

    font-family:'Space Grotesk',sans-serif;

    text-align:center;
}

/* ===== GRAFICA ===== */

.graph-container{

    width:100%;

    height:calc(100vh - 260px);

    background:rgba(255,255,255,0.04);

    border-radius:22px;

    padding:15px;

    border:1px solid rgba(255,255,255,0.06);

    backdrop-filter:blur(10px);
}

#grafica{

    width:100%;

    height:100%;
}

/* ===== RESPONSIVE ===== */

@media(max-width:1100px){

    .main{

        flex-direction:column;
    }

    .sidebar{

        width:100%;

        border-right:none;

        border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .graph-container{

        height:700px;
    }
}

</style>

</head>

<body>

<header>

<h1>CÁLCULO INTEGRAL</h1>

<p>Calculadora gráfica interactiva de Sumas de Riemann</p>

</header>

<div class="main">

<!-- ===== PANEL IZQUIERDO ===== -->

<div class="sidebar">

<h2>Controles</h2>

<div class="campo">

<label>Función f(x)</label>

<input type="text" id="funcion" value="sin(x)">

</div>

<div class="campo">

<label>Extremo inferior (a)</label>

<input type="number" id="a" value="0">

</div>

<div class="campo">

<label>Extremo superior (b)</label>

<input type="number" id="b" value="1">

</div>

<div class="campo">

<label>Método</label>

<select id="metodo">

<option value="derecho">
Extremo derecho
</option>

<option value="izquierdo">
Extremo izquierdo
</option>

<option value="medio">
Punto medio
</option>

</select>

</div>

<div class="campo">

<label>Número de particiones (n)</label>

<div class="slider-container">

<input
type="range"
min="1"
max="100"
value="4"
id="sliderN"
oninput="actualizarN()"
>

<div class="slider-value">

n = <span id="valorN">4</span>

</div>

</div>

</div>

<div class="botones">

<button onclick="graficar()">
Calcular
</button>

<button onclick="descargarGrafica()">
Descargar gráfica
</button>

</div>

<div class="resultados">

<h3>Resultados</h3>

<div id="resultado"></div>

</div>

</div>

<!-- ===== PANEL DERECHO ===== -->

<div class="content">

<div class="formula-box">

<div class="formula" id="formulaVisual">

∫₀¹ sin(x) dx

</div>

</div>

<div class="graph-container">

<div id="grafica"></div>

</div>

</div>

</div>

<script>

function actualizarN(){

    document.getElementById("valorN").innerHTML =

    document.getElementById("sliderN").value;

    graficar();
}

function convertirFuncion(expr){

    expr = expr.replaceAll("ln","Math.log");
    expr = expr.replaceAll("sin","Math.sin");
    expr = expr.replaceAll("cos","Math.cos");
    expr = expr.replaceAll("tan","Math.tan");
    expr = expr.replaceAll("sqrt","Math.sqrt");

    return expr;
}

function formulaBonita(expr){

    let t = expr;

    t = t.replaceAll("*","");

    t = t.replaceAll("x*x*x","x³");

    t = t.replaceAll("x*x","x²");

    return t;
}

function f(x,expr){

    return eval(expr.replaceAll("x","("+x+")"));
}

function integralNumerica(expr,a,b){

    let pasos = 10000;

    let h = (b-a)/pasos;

    let total = 0;

    for(let i=0;i<pasos;i++){

        let x = a + i*h;

        total += f(x,expr)*h;
    }

    return total;
}

function graficar(){

    let exprOriginal =

    document.getElementById("funcion").value;

    let expr = convertirFuncion(exprOriginal);

    let a = parseFloat(

    document.getElementById("a").value);

    let b = parseFloat(

    document.getElementById("b").value);

    let n = parseInt(

    document.getElementById("sliderN").value);

    let metodo =

    document.getElementById("metodo").value;

    let dx = (b-a)/n;

    let suma = 0;

    let datos = [];

    let x_func = [];

    let y_func = [];

    let xmin = a - Math.abs(b-a);

    let xmax = b + Math.abs(b-a);

    for(let x=xmin;x<=xmax;x+=0.01){

        try{

            x_func.push(x);

            y_func.push(f(x,expr));

        }catch{}
    }

    /* CURVA */

    datos.push({

        x:x_func,

        y:y_func,

        mode:"lines",

        line:{
            width:4,
            color:"#4fc3f7"
        },

        showlegend:false
    });

    /* RECTANGULOS */

    let colores = [

        "rgba(66,165,245,0.45)",
        "rgba(126,87,194,0.45)",
        "rgba(38,198,218,0.45)",
        "rgba(92,107,192,0.45)"
    ];

    for(let i=0;i<n;i++){

        let xi;

        if(metodo=="derecho"){

            xi = a + (i+1)*dx;
        }

        else if(metodo=="izquierdo"){

            xi = a + i*dx;
        }

        else{

            xi = a + (i+0.5)*dx;
        }

        let altura = f(xi,expr);

        suma += altura*dx;

        datos.push({

            x:[
                a+i*dx,
                a+(i+1)*dx,
                a+(i+1)*dx,
                a+i*dx,
                a+i*dx
            ],

            y:[
                0,
                0,
                altura,
                altura,
                0
            ],

            fill:"toself",

            fillcolor:colores[i % colores.length],

            line:{
                color:"#7fd8ff"
            },

            mode:"lines",

            type:"scatter",

            showlegend:false
        });
    }

    let areaExacta =

    integralNumerica(expr,a,b);

    let error =

    Math.abs(

    (areaExacta-suma)/areaExacta

    )*100;

    let layout = {

        title:{

            text:"Visualización dinámica",

            font:{
                color:"#7fd8ff",
                size:26
            }
        },

        paper_bgcolor:"rgba(0,0,0,0)",

        plot_bgcolor:"rgba(0,0,0,0)",

        dragmode:"zoom",

        hovermode:"closest",

        showlegend:false,

        xaxis:{

            title:"x",

            color:"#d6e6ff",

            gridcolor:"rgba(255,255,255,0.08)",

            zerolinecolor:"#7fd8ff"
        },

        yaxis:{

            title:"y",

            color:"#d6e6ff",

            gridcolor:"rgba(255,255,255,0.08)",

            zerolinecolor:"#7fd8ff"
        },

        annotations:[

        {

            x:(a+b)/2,

            y:Math.max(...y_func),

            text:

            "Área aproximada ≈ " +

            suma.toFixed(5),

            showarrow:false,

            bgcolor:"#0b1f3a",

            bordercolor:"#7fd8ff",

            borderwidth:1,

            font:{
                color:"#7fd8ff",
                size:16
            },

            borderpad:8
        }]
    };

    let config = {

        responsive:true,

        scrollZoom:true
    };

    Plotly.newPlot(

        "grafica",
        datos,
        layout,
        config
    );

    /* FORMULA */

    document.getElementById("formulaVisual").innerHTML =

    "∫<sub>" +

    a +

    "</sub><sup>" +

    b +

    "</sup> " +

    formulaBonita(exprOriginal) +

    " dx";

    /* RESULTADOS */

    document.getElementById("resultado").innerHTML =

    `

    <div class="resultado-item">

    <div class="resultado-titulo">

    Método

    </div>

    <div class="resultado-valor">

    ${metodo}

    </div>

    </div>

    <div class="resultado-item">

    <div class="resultado-titulo">

    Ancho de cada partición (Δx)

    </div>

    <div class="resultado-valor">

    ${dx.toFixed(6)}

    </div>

    </div>

    <div class="resultado-item">

    <div class="resultado-titulo">

    Área aproximada

    </div>

    <div class="resultado-valor">

    ${suma.toFixed(6)}

    </div>

    </div>

    <div class="resultado-item">

    <div class="resultado-titulo">

    Área exacta

    </div>

    <div class="resultado-valor">

    ${areaExacta.toFixed(6)}

    </div>

    </div>

    <div class="resultado-item">

    <div class="resultado-titulo">

    Error porcentual

    </div>

    <div class="resultado-valor">

    ${error.toFixed(4)}%

    </div>

    </div>

    `;
}

function descargarGrafica(){

    Plotly.downloadImage(

        "grafica",

        {

            format:"png",

            filename:"suma_riemann",

            width:1600,

            height:900
        }
    );
}

/* INICIO */

graficar();

</script>

</body>

</html>
