<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Cálculo Integral - Sumas de Riemann</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

body{

    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

header{

    text-align:center;
    padding:25px;
}

header h1{

    margin:0;
    font-size:42px;
}

header p{

    font-size:20px;
    opacity:0.9;
}

.panel{

    background:white;
    color:black;
    width:92%;
    max-width:1200px;
    margin:auto;
    border-radius:20px;
    padding:25px;
    box-shadow:0px 0px 25px rgba(0,0,0,0.4);
}

.formulario{

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
}

.campo{

    display:flex;
    flex-direction:column;
    text-align:left;
}

.campo label{

    margin-bottom:8px;
    font-weight:bold;
    color:#1565c0;
}

input, select{

    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    width:180px;
    box-shadow:0px 2px 6px rgba(0,0,0,0.2);
}

button{

    padding:14px 28px;
    border:none;
    border-radius:12px;
    background:#1565c0;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    margin-top:28px;
}

button:hover{

    background:#0d47a1;
    transform:scale(1.05);
}

.botones{

    display:flex;
    gap:15px;
    align-items:center;
}

#grafica{

    width:100%;
    height:750px;
}

.resultado{

    text-align:center;
    font-size:22px;
    margin:20px;
    color:#1565c0;
    font-weight:bold;
    line-height:1.8;
}

.metodo{

    color:#c62828;
    font-weight:bold;
}

</style>

</head>

<body>

<header>

<h1>CÁLCULO INTEGRAL</h1>

<p>Calculadora Gráfica de Sumas de Riemann</p>

</header>

<div class="panel">

<div class="formulario">

<div class="campo">

<label>Función:</label>

<input type="text" id="funcion" placeholder="Ejemplo: x*x">

</div>

<div class="campo">

<label>Extremo inferior (a):</label>

<input type="number" id="a" placeholder="a">

</div>

<div class="campo">

<label>Extremo superior (b):</label>

<input type="number" id="b" placeholder="b">

</div>

<div class="campo">

<label>Número de particiones (n):</label>

<input type="number" id="n" placeholder="n">

</div>

<div class="campo">

<label>Método:</label>

<select id="metodo">

<option value="derecho">
Extremo derecho
</option>

<option value="izquierdo">
Extremo izquierdo
</option>

<option value="medio">
Punto medio
</option>

</select>

</div>

<div class="botones">

<button onclick="graficar()">
Calcular
</button>

<button onclick="descargarGrafica()">
Descargar gráfica
</button>

</div>

</div>

<div class="resultado" id="resultado"></div>

<div id="grafica"></div>

</div>

<script>

function convertirFuncion(expr){

    expr = expr.replaceAll("ln","Math.log");
    expr = expr.replaceAll("sin","Math.sin");
    expr = expr.replaceAll("cos","Math.cos");
    expr = expr.replaceAll("tan","Math.tan");
    expr = expr.replaceAll("sqrt","Math.sqrt");

    return expr;
}

function f(x,expr){

    return eval(expr.replaceAll("x","("+x+")"));
}

function integralNumerica(expr,a,b){

    let pasos = 10000;

    let h = (b-a)/pasos;

    let total = 0;

    for(let i=0;i<pasos;i++){

        let x = a + i*h;

        total += f(x,expr)*h;
    }

    return total;
}

function graficar(){

    let exprOriginal = document.getElementById("funcion").value;

    let expr = convertirFuncion(exprOriginal);

    let a = parseFloat(document.getElementById("a").value);

    let b = parseFloat(document.getElementById("b").value);

    let n = parseInt(document.getElementById("n").value);

    let metodo = document.getElementById("metodo").value;

    let dx = (b-a)/n;

    let suma = 0;

    let datos = [];

    let x_func = [];
    let y_func = [];

    let xmin = a - Math.abs(b-a);
    let xmax = b + Math.abs(b-a);

    for(let x=xmin; x<=xmax; x+=0.01){

        try{

            x_func.push(x);

            y_func.push(f(x,expr));

        }catch{

        }
    }

    datos.push({

        x:x_func,

        y:y_func,

        mode:"lines",

        line:{
            width:4
        },

        name:"f(x)"
    });

    for(let i=0; i<n; i++){

        let xi;

        if(metodo=="derecho"){

            xi = a + (i+1)*dx;
        }

        else if(metodo=="izquierdo"){

            xi = a + i*dx;
        }

        else{

            xi = a + (i+0.5)*dx;
        }

        let altura = f(xi,expr);

        suma += altura*dx;

        datos.push({

            x:[
                a+i*dx,
                a+(i+1)*dx,
                a+(i+1)*dx,
                a+i*dx,
                a+i*dx
            ],

            y:[
                0,
                0,
                altura,
                altura,
                0
            ],

            fill:"toself",

            opacity:0.45,

            type:"scatter",

            mode:"lines",

            name:"Rectángulo"
        });
    }

    let areaExacta = integralNumerica(expr,a,b);

    let error =

    Math.abs(

    (areaExacta - suma)/areaExacta

    )*100;

    let nombreMetodo = "";

    let formula = "";

    if(metodo=="derecho"){

        nombreMetodo = "Extremo derecho";

        formula = "Σ f(xi*) Δx";
    }

    else if(metodo=="izquierdo"){

        nombreMetodo = "Extremo izquierdo";

        formula = "Σ f(xi) Δx";
    }

    else{

        nombreMetodo = "Punto medio";

        formula = "Σ f(xi medio) Δx";
    }

    let layout = {

        title:"Visualización de la Suma de Riemann",

        dragmode:"zoom",

        hovermode:"closest",

        xaxis:{

            title:"Eje X",

            zeroline:true,

            showgrid:true
        },

        yaxis:{

            title:"Eje Y",

            zeroline:true,

            showgrid:true
        },

        annotations:[

        {

            x:a,

            y:Math.max(...y_func),

            text:

            "Área aprox: " +

            suma.toFixed(4),

            showarrow:false,

            font:{
                size:18
            }
        }]
    };

    let config = {

        responsive:true,

        scrollZoom:true
    };

    Plotly.newPlot(

        "grafica",
        datos,
        layout,
        config
    );

    document.getElementById("resultado").innerHTML =

    "Método: <span class='metodo'>" +

    nombreMetodo +

    "</span><br><br>" +

    "Δx = " +

    dx.toFixed(6)

    +

    "<br><br>" +

    "Área aproximada = " +

    suma.toFixed(6)

    +

    "<br><br>" +

    "Área exacta ≈ " +

    areaExacta.toFixed(6)

    +

    "<br><br>" +

    "Error porcentual ≈ " +

    error.toFixed(4)

    +

    "%<br><br>" +

    "Fórmula utilizada:<br>" +

    formula +

    "<br><br>" +

    "Límite asociado:<br>" +

    "lim n→∞ Σ f(xi*) Δx";
}

function descargarGrafica(){

    Plotly.downloadImage(

        "grafica",

        {

            format:"png",

            filename:"suma_riemann",

            height:700,

            width:1200
        }
    );
}

</script>

</body>

</html>
