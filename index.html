<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Calculadora Gráfica</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

body{
    font-family: Arial;
    text-align:center;
    margin-top:30px;
    background:#f5f5f5;
}

h1{
    color:#333;
}

input{
    width:300px;
    padding:10px;
    font-size:18px;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

#grafica{
    width:90%;
    height:600px;
    margin:auto;
    background:white;
}

</style>

</head>

<body>

<h1>Calculadora Gráfica</h1>

<p>Escribe funciones como:</p>

<p>
x*x <br>
Math.sin(x) <br>
x*x*x - 2*x
</p>

<input type="text" id="funcion" placeholder="Ejemplo: x*x">

<button onclick="graficar()">
Graficar
</button>

<div id="grafica"></div>

<script>

function graficar(){

    let expr = document.getElementById("funcion").value;

    let x = [];
    let y = [];

    for(let i=-10; i<=10; i+=0.1){

        x.push(i);

        let valor;

        try{
            valor = eval(expr.replaceAll("x", "(" + i + ")"));
        }
        catch{
            valor = NaN;
        }

        y.push(valor);
    }

    let datos = [{
        x:x,
        y:y,
        mode:"lines",
        name:"f(x)"
    }];

    let layout = {

        title:"Gráfica",

        xaxis:{
            range:[-10,10],
            zeroline:true
        },

        yaxis:{
            range:[-10,10],
            zeroline:true
        },

        showlegend:false
    };

    Plotly.newPlot("grafica", datos, layout);
}

</script>

</body>

</html>
