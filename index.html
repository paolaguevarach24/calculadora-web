<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cálculo Integral | Sumas de Riemann</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1f3a;color:white}
header{text-align:center;padding:20px}
.main{display:flex;min-height:100vh}
.sidebar{width:320px;background:#10243d;padding:20px}
.content{flex:1;padding:20px}
label{display:block;margin-top:12px}
input,select{width:100%;padding:10px;margin-top:5px}
button{width:100%;padding:12px;margin-top:15px}
.graph{background:white;border-radius:10px;height:650px}
#grafica{width:100%;height:100%}
table{width:100%;margin-top:15px;background:#10243d}
th,td{padding:10px;text-align:center}
</style>
</head>
<body>
<header>
<h1>CÁLCULO INTEGRAL</h1>
<p>Calculadora gráfica interactiva de Sumas de Riemann</p>
</header>

<div class="main">
<div class="sidebar">
<h2>Controles</h2>

<label>Función f(x)</label>
<input id="funcion" oninput="graficar()">

<label>Extremo inferior (a)</label>
<input type="number" id="a" oninput="graficar()">

<label>Extremo superior (b)</label>
<input type="number" id="b" oninput="graficar()">

<label>Método</label>
<select id="metodo" onchange="graficar()">
<option value="derecho">Extremo derecho</option>
<option value="izquierdo">Extremo izquierdo</option>
<option value="medio">Punto medio</option>
</select>

<label>Número de particiones (n)</label>
<input type="range" min="1" max="1000" value="10" id="sliderN" oninput="syncSlider()">
<div>n = <span id="valorN">10</span></div>

<input type="number" id="inputN" value="10" oninput="syncInput()">

<button onclick="descargarGrafica()">Descargar gráfica</button>

</div>

<div class="content">
<div class="graph">
<div id="grafica"></div>
</div>

<table>
<tr>
<th>Método</th>
<th>Ancho (Δx)</th>
<th>Área aproximada</th>
<th>Área exacta</th>
<th>Error %</th>
</tr>
<tr>
<td id="rMetodo">-</td>
<td id="rDx">-</td>
<td id="rAprox">-</td>
<td id="rExacta">-</td>
<td id="rError">-</td>
</tr>
</table>
</div>
</div>

<script>
function syncSlider(){
 let v=document.getElementById('sliderN').value;
 document.getElementById('valorN').innerText=v;
 document.getElementById('inputN').value=v;
 graficar();
}

function syncInput(){
 let v=parseInt(document.getElementById('inputN').value)||1;
 document.getElementById('valorN').innerText=v;
 document.getElementById('sliderN').value=Math.min(v,1000);
 graficar();
}

function conv(e){
 return e.replaceAll('ln','Math.log')
 .replaceAll('sin','Math.sin')
 .replaceAll('cos','Math.cos')
 .replaceAll('tan','Math.tan')
 .replaceAll('sqrt','Math.sqrt');
}

function f(x,e){ return eval(e.replaceAll('x','('+x+')')); }

function integral(e,a,b){
 let n=10000,h=(b-a)/n,s=0;
 for(let i=0;i<n;i++) s+=f(a+i*h,e)*h;
 return s;
}

function graficar(){
 let ex0=document.getElementById('funcion').value;
 if(!ex0) return;

 let a=parseFloat(document.getElementById('a').value);
 let b=parseFloat(document.getElementById('b').value);
 if(isNaN(a)||isNaN(b)) return;

 let ex=conv(ex0);
 let n=parseInt(document.getElementById('inputN').value)||1;
 let m=document.getElementById('metodo').value;

 let dx=(b-a)/n;
 let suma=0;

 let xf=[], yf=[];
 for(let x=a-Math.abs(b-a); x<=b+Math.abs(b-a); x+=0.02){
  try{ xf.push(x); yf.push(f(x,ex)); }catch(err){}
 }

 let data=[{
  x:xf,y:yf,type:'scatter',mode:'lines',
  name:'f(x)='+ex0
 }];

 if(n<=300){
  for(let i=0;i<n;i++){
   let xi=m=="derecho"?a+(i+1)*dx:m=="izquierdo"?a+i*dx:a+(i+0.5)*dx;
   let h=f(xi,ex);
   suma+=h*dx;

   data.push({
    x:[a+i*dx,a+(i+1)*dx,a+(i+1)*dx,a+i*dx,a+i*dx],
    y:[0,0,h,h,0],
    fill:'toself',
    type:'scatter',
    showlegend:false
   });
  }
 }else{
  for(let i=0;i<n;i++){
   let xi=m=="derecho"?a+(i+1)*dx:m=="izquierdo"?a+i*dx:a+(i+0.5)*dx;
   suma+=f(xi,ex)*dx;
  }
 }

 let exacta=integral(ex,a,b);
 let error=Math.abs((exacta-suma)/exacta)*100;

 data.push({
  x:[null],y:[null],
  mode:'markers',
  name:'Área ≈ '+suma.toFixed(5)
 });

 Plotly.newPlot('grafica',data,{
  paper_bgcolor:'white',
  plot_bgcolor:'white',
  legend:{x:1.02,y:1}
 },{responsive:true,scrollZoom:true});

 document.getElementById('rMetodo').innerText=
  m=="derecho"?"Extremo derecho":m=="izquierdo"?"Extremo izquierdo":"Punto medio";
 document.getElementById('rDx').innerText=dx.toFixed(2);
 document.getElementById('rAprox').innerText=suma.toFixed(6);
 document.getElementById('rExacta').innerText=exacta.toFixed(6);
 document.getElementById('rError').innerText=error.toFixed(4)+'%';
}

function descargarGrafica(){
 Plotly.downloadImage('grafica',{format:'png',filename:'suma_riemann'});
}
</script>
</body>
</html>
