<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Sumas de Riemann</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

body{
    font-family:Arial;
    text-align:center;
    background:#f4f4f4;
}

input{
    padding:8px;
    margin:5px;
    width:120px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#grafica{
    width:90%;
    height:700px;
    margin:auto;
    background:white;
}

</style>

</head>

<body>

<h1>Calculadora de Sumas de Riemann</h1>

<input type="text" id="funcion" placeholder="f(x) = x*x">

<input type="number" id="a" placeholder="a">

<input type="number" id="b" placeholder="b">

<input type="number" id="n" placeholder="n">

<button onclick="graficar()">
Calcular
</button>

<h2 id="resultado"></h2>

<div id="grafica"></div>

<script>

function f(x, expr){

    return eval(expr.replaceAll("x", "(" + x + ")"));
}

function graficar(){

    let expr = document.getElementById("funcion").value;

    let a = parseFloat(document.getElementById("a").value);

    let b = parseFloat(document.getElementById("b").value);

    let n = parseInt(document.getElementById("n").value);

    let dx = (b-a)/n;

    let suma = 0;

    let x_func = [];
    let y_func = [];

    // curva
    for(let x=a; x<=b; x+=0.01){

        x_func.push(x);

        y_func.push(f(x,expr));
    }

    let datos = [];

    datos.push({
        x:x_func,
        y:y_func,
        mode:"lines",
        name:"f(x)"
    });

    // rectángulos derechos
    for(let i=1; i<=n; i++){

        let xi = a + i*dx;

        let altura = f(xi,expr);

        suma += altura*dx;

        let rectangulo = {
            x:[
                xi-dx,
                xi,
                xi,
                xi-dx,
                xi-dx
            ],

            y:[
                0,
                0,
                altura,
                altura,
                0
            ],

            fill:"toself",
            type:"scatter",
            mode:"lines",
            name:"Rectángulo"
        };

        datos.push(rectangulo);
    }

    Plotly.newPlot("grafica", datos);

    document.getElementById("resultado").innerHTML =

        "Área aproximada = " + suma.toFixed(6) +

        "<br>Δx = " + dx.toFixed(4);
}

</script>

</body>

</html>
