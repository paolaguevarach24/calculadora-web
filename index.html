<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Cálculo Integral - Sumas de Riemann</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

body{

    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    text-align:center;
}

header{

    padding:25px;
    font-size:35px;
    font-weight:bold;
}

.subtitulo{

    font-size:20px;
    margin-bottom:20px;
}

.panel{

    background:white;
    color:black;
    width:90%;
    max-width:1000px;
    margin:auto;
    padding:20px;
    border-radius:20px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.3);
}

input{

    padding:12px;
    margin:8px;
    border-radius:10px;
    border:none;
    width:140px;
    font-size:16px;
    box-shadow:0px 2px 5px rgba(0,0,0,0.2);
}

button{

    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:#1e88e5;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{

    background:#1565c0;
    transform:scale(1.05);
}

#grafica{

    width:100%;
    height:750px;
    margin-top:20px;
}

.resultado{

    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#1565c0;
}

.info{

    margin-top:15px;
    color:#444;
}

</style>

</head>

<body>

<header>

CÁLCULO INTEGRAL

</header>

<div class="subtitulo">

Calculadora Gráfica de Sumas de Riemann

</div>

<div class="panel">

<div class="info">

Escribe funciones como:
<br><br>

x*x
<br>
sin(x)
<br>
ln(x)/x

</div>

<br>

<input type="text" id="funcion" placeholder="f(x)">

<input type="number" id="a" placeholder="a">

<input type="number" id="b" placeholder="b">

<input type="number" id="n" placeholder="n">

<button onclick="graficar()">

Calcular

</button>

<div class="resultado" id="resultado"></div>

<div id="grafica"></div>

</div>

<script>

function convertirFuncion(expr){

    expr = expr.replaceAll("ln","Math.log");
    expr = expr.replaceAll("sin","Math.sin");
    expr = expr.replaceAll("cos","Math.cos");
    expr = expr.replaceAll("tan","Math.tan");
    expr = expr.replaceAll("sqrt","Math.sqrt");

    return expr;
}

function f(x,expr){

    return eval(expr.replaceAll("x","("+x+")"));
}

function graficar(){

    let expr = document.getElementById("funcion").value;

    expr = convertirFuncion(expr);

    let a = parseFloat(document.getElementById("a").value);

    let b = parseFloat(document.getElementById("b").value);

    let n = parseInt(document.getElementById("n").value);

    let dx = (b-a)/n;

    let suma = 0;

    let x_func = [];
    let y_func = [];

    // Rango amplio de visualización
    let xmin = a - Math.abs(b-a);
    let xmax = b + Math.abs(b-a);

    for(let x=xmin; x<=xmax; x+=0.01){

        try{

            x_func.push(x);

            y_func.push(f(x,expr));

        }catch{

        }
    }

    let datos = [];

    // Función
    datos.push({

        x:x_func,
        y:y_func,
        mode:"lines",
        line:{
            width:4
        },
        name:"f(x)"
    });

    // Rectángulos derechos
    for(let i=1; i<=n; i++){

        let xi = a + i*dx;

        let altura = f(xi,expr);

        suma += altura*dx;

        datos.push({

            x:[xi-dx,xi,xi,xi-dx,xi-dx],

            y:[0,0,altura,altura,0],

            fill:"toself",

            opacity:0.4,

            type:"scatter",

            mode:"lines",

            name:"Rectángulo"
        });
    }

    let layout = {

        title:"Visualización de la Suma de Riemann",

        dragmode:"zoom",

        xaxis:{

            zeroline:true,
            showgrid:true
        },

        yaxis:{

            zeroline:true,
            showgrid:true
        },

        hovermode:"closest"
    };

    let config = {

        scrollZoom:true,
        responsive:true
    };

    Plotly.newPlot(

        "grafica",
        datos,
        layout,
        config
    );

    document.getElementById("resultado").innerHTML =

        "Área aproximada = " +

        suma.toFixed(6)

        +

        "<br>Δx = " +

        dx.toFixed(6);
}

</script>

</body>

</html>
