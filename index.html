<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cálculo Integral | Sumas de Riemann</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top left,#17376e,#081426 60%);

    color:white;

    font-family:'Inter',sans-serif;

    min-height:100vh;

    overflow-x:hidden;
}

/* ===== HEADER ===== */

header{

    width:100%;

    padding:25px 40px;

    text-align:center;

    border-bottom:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);
}

header h1{

    font-family:'Space Grotesk',sans-serif;

    font-size:42px;

    color:#7fd8ff;

    letter-spacing:2px;

    text-shadow:0px 0px 12px rgba(127,216,255,0.4);
}

header p{

    margin-top:10px;

    color:#dbe9ff;

    font-size:18px;
}

/* ===== CONTENEDOR PRINCIPAL ===== */

.main{

    display:flex;

    width:100%;

    min-height:calc(100vh - 110px);
}

/* ===== SIDEBAR ===== */

.sidebar{

    width:340px;

    background:rgba(10,20,35,0.88);

    border-right:1px solid rgba(255,255,255,0.06);

    padding:30px;

    backdrop-filter:blur(12px);
}

.sidebar h2{

    font-family:'Space Grotesk',sans-serif;

    color:#7fd8ff;

    margin-bottom:28px;

    font-size:28px;
}

/* ===== CAMPOS ===== */

.campo{

    margin-bottom:24px;
}

.campo label{

    display:block;

    margin-bottom:10px;

    color:#9ecbff;

    font-weight:600;

    font-size:15px;
}

input,
select{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:#10243d;

    color:white;

    font-size:16px;

    outline:none;

    transition:0.3s;

    border:1px solid transparent;
}

input:focus,
select:focus{

    border:1px solid #4fc3f7;

    box-shadow:0px 0px 15px rgba(79,195,247,0.4);
}

/* ===== SLIDER ===== */

.slider-value{

    margin-top:10px;

    color:#7fd8ff;

    font-weight:bold;

    font-size:18px;
}

input[type="range"]{

    appearance:none;

    height:8px;

    background:#1d3a63;

    border-radius:10px;

    padding:0;
}

input[type="range"]::-webkit-slider-thumb{

    appearance:none;

    width:22px;

    height:22px;

    border-radius:50%;

    background:#4fc3f7;

    cursor:pointer;

    box-shadow:0px 0px 12px rgba(79,195,247,0.7);
}

/* ===== BOTON ===== */

.boton-descarga{

    margin-top:30px;
}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:linear-gradient(135deg,#1976d2,#42a5f5);

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    font-family:'Inter',sans-serif;

    box-shadow:0px 0px 18px rgba(66,165,245,0.25);
}

button:hover{

    transform:translateY(-2px);

    box-shadow:0px 0px 22px rgba(66,165,245,0.45);
}

/* ===== CONTENIDO ===== */

.content{

    flex:1;

    padding:25px;

    display:flex;

    flex-direction:column;
}

/* ===== GRAFICA ===== */

.graph-container{

    flex:1;

    background:white;

    border-radius:24px;

    padding:15px;

    box-shadow:0px 0px 25px rgba(0,0,0,0.25);
}

#grafica{

    width:100%;

    height:100%;
}

/* ===== RESULTADOS ===== */

.resultados{

    margin-top:18px;

    background:rgba(255,255,255,0.05);

    border-radius:18px;

    padding:18px;

    backdrop-filter:blur(8px);

    overflow-x:auto;
}

.resultados table{

    width:100%;

    border-collapse:collapse;

    color:white;

    min-width:900px;
}

.resultados th{

    color:#7fd8ff;

    padding-bottom:12px;

    font-size:15px;

    border-bottom:1px solid rgba(255,255,255,0.08);
}

.resultados td{

    text-align:center;

    padding-top:16px;

    font-size:17px;

    font-weight:600;
}

/* ===== RESPONSIVE ===== */

@media(max-width:1100px){

    .main{

        flex-direction:column;
    }

    .sidebar{

        width:100%;

        border-right:none;

        border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .graph-container{

        height:700px;
    }
}

</style>

</head>

<body>

<header>

<h1>CÁLCULO INTEGRAL</h1>

<p>Calculadora gráfica interactiva de Sumas de Riemann</p>

</header>

<div class="main">

<!-- ===== CONTROLES ===== -->

<div class="sidebar">

<h2>Controles</h2>

<div class="campo">

<label>Función f(x)</label>

<input
type="text"
id="funcion"
value="sin(x)"
oninput="graficar()"
>

</div>

<div class="campo">

<label>Extremo inferior (a)</label>

<input
type="number"
id="a"
value="0"
oninput="graficar()"
>

</div>

<div class="campo">

<label>Extremo superior (b)</label>

<input
type="number"
id="b"
value="1"
oninput="graficar()"
>

</div>

<div class="campo">

<label>Método</label>

<select
id="metodo"
onchange="graficar()"
>

<option value="derecho">
Extremo derecho
</option>

<option value="izquierdo">
Extremo izquierdo
</option>

<option value="medio">
Punto medio
</option>

</select>

</div>

<div class="campo">

<label>Número de particiones (n)</label>

<input
type="range"
min="1"
max="100"
value="4"
id="sliderN"
oninput="actualizarN()"
>

<div class="slider-value">

n = <span id="valorN">4</span>

</div>

</div>

<div class="boton-descarga">

<button onclick="descargarGrafica()">

Descargar gráfica

</button>

</div>

</div>

<!-- ===== CONTENIDO ===== -->

<div class="content">

<!-- GRAFICA -->

<div class="graph-container">

<div id="grafica"></div>

</div>

<!-- RESULTADOS -->

<div class="resultados">

<table>

<thead>

<tr>

<th>Método</th>

<th>Ancho de cada partición (Δx)</th>

<th>Área aproximada</th>

<th>Área exacta</th>

<th>Error porcentual</th>

</tr>

</thead>

<tbody>

<tr>

<td id="rMetodo">-</td>

<td id="rDx">-</td>

<td id="rAprox">-</td>

<td id="rExacta">-</td>

<td id="rError">-</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script>

function actualizarN(){

    document.getElementById("valorN").innerHTML =

    document.getElementById("sliderN").value;

    graficar();
}

function convertirFuncion(expr){

    expr = expr.replaceAll("ln","Math.log");
    expr = expr.replaceAll("sin","Math.sin");
    expr = expr.replaceAll("cos","Math.cos");
    expr = expr.replaceAll("tan","Math.tan");
    expr = expr.replaceAll("sqrt","Math.sqrt");

    return expr;
}

function formulaBonita(expr){

    let t = expr;

    t = t.replaceAll("x*x*x","x³");

    t = t.replaceAll("x*x","x²");

    return t;
}

function f(x,expr){

    return eval(expr.replaceAll("x","("+x+")"));
}

function integralNumerica(expr,a,b){

    let pasos = 10000;

    let h = (b-a)/pasos;

    let total = 0;

    for(let i=0;i<pasos;i++){

        let x = a + i*h;

        total += f(x,expr)*h;
    }

    return total;
}

function graficar(){

    let exprOriginal =

    document.getElementById("funcion").value;

    let expr = convertirFuncion(exprOriginal);

    let a = parseFloat(

    document.getElementById("a").value);

    let b = parseFloat(

    document.getElementById("b").value);

    let n = parseInt(

    document.getElementById("sliderN").value);

    let metodo =

    document.getElementById("metodo").value;

    let dx = (b-a)/n;

    let suma = 0;

    let datos = [];

    let x_func = [];

    let y_func = [];

    let xmin = a - Math.abs(b-a);

    let xmax = b + Math.abs(b-a);

    for(let x=xmin;x<=xmax;x+=0.01){

        try{

            x_func.push(x);

            y_func.push(f(x,expr));

        }catch{}
    }

    /* CURVA */

    datos.push({

        x:x_func,

        y:y_func,

        mode:"lines",

        line:{
            width:4,
            color:"#00bcd4"
        },

        showlegend:false
    });

    /* RECTANGULOS */

    let colores = [

        "rgba(33,150,243,0.45)",
        "rgba(126,87,194,0.45)",
        "rgba(0,188,212,0.45)",
        "rgba(92,107,192,0.45)"
    ];

    for(let i=0;i<n;i++){

        let xi;

        if(metodo=="derecho"){

            xi = a + (i+1)*dx;
        }

        else if(metodo=="izquierdo"){

            xi = a + i*dx;
        }

        else{

            xi = a + (i+0.5)*dx;
        }

        let altura = f(xi,expr);

        suma += altura*dx;

        datos.push({

            x:[
                a+i*dx,
                a+(i+1)*dx,
                a+(i+1)*dx,
                a+i*dx,
                a+i*dx
            ],

            y:[
                0,
                0,
                altura,
                altura,
                0
            ],

            fill:"toself",

            fillcolor:colores[i % colores.length],

            line:{
                color:"#1565c0"
            },

            mode:"lines",

            type:"scatter",

            showlegend:false
        });
    }

    let areaExacta =

    integralNumerica(expr,a,b);

    let error =

    Math.abs(

    (areaExacta-suma)/areaExacta

    )*100;

    let layout = {

        title:{

            text:"Visualización dinámica",

            font:{
                color:"#0d47a1",
                size:26
            }
        },

        paper_bgcolor:"white",

        plot_bgcolor:"white",

        dragmode:"zoom",

        hovermode:"closest",

        showlegend:false,

        xaxis:{

            title:"x",

            color:"#0d47a1",

            gridcolor:"#d6e4f0",

            zerolinecolor:"#0d47a1"
        },

        yaxis:{

            title:"y",

            color:"#0d47a1",

            gridcolor:"#d6e4f0",

            zerolinecolor:"#0d47a1"
        },

        annotations:[

        {

            x:(a+b)/2,

            y:Math.max(...y_func),

            text:

            "f(x) = " +

            formulaBonita(exprOriginal)

            +

            "<br><br>"

            +

            "Área aproximada ≈ "

            +

            suma.toFixed(5),

            showarrow:false,

            bgcolor:"#0d47a1",

            bordercolor:"#42a5f5",

            borderwidth:1,

            font:{
                color:"white",
                size:16
            },

            borderpad:10
        }]
    };

    Plotly.newPlot(

        "grafica",
        datos,
        layout,
        {

            responsive:true,

            scrollZoom:true
        }
    );

    /* RESULTADOS */

    document.getElementById("rMetodo").innerHTML =

    metodo;

    document.getElementById("rDx").innerHTML =

    dx.toFixed(6);

    document.getElementById("rAprox").innerHTML =

    suma.toFixed(6);

    document.getElementById("rExacta").innerHTML =

    areaExacta.toFixed(6);

    document.getElementById("rError").innerHTML =

    error.toFixed(4) + "%";
}

function descargarGrafica(){

    Plotly.downloadImage(

        "grafica",

        {

            format:"png",

            filename:"suma_riemann",

            width:1600,

            height:900
        }
    );
}

graficar();

</script>

</body>

</html>
