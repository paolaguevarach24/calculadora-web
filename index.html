<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Cálculo Integral - Sumas de Riemann</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

body{

    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0b1f3a,#102c54,#163d73);
    color:white;
}

/* ENCABEZADO */

header{

    text-align:center;
    padding:20px;
}

header h1{

    margin:0;
    font-size:42px;
    letter-spacing:2px;
}

header p{

    margin-top:10px;
    font-size:20px;
}

/* PANEL PRINCIPAL */

.panel{

    width:95%;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0px 0px 25px rgba(0,0,0,0.35);
    color:black;
}

/* FORMULARIO */

.formulario{

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-bottom:25px;
}

.campo{

    display:flex;
    flex-direction:column;
}

.campo label{

    margin-bottom:8px;
    font-weight:bold;
    color:#0d47a1;
}

input, select{

    padding:12px;
    width:180px;
    border:none;
    border-radius:12px;
    font-size:16px;
    background:#e8f1ff;
    box-shadow:0px 2px 6px rgba(0,0,0,0.2);
}

/* BOTONES */

.botones{

    display:flex;
    gap:15px;
    align-items:end;
}

button{

    padding:14px 28px;
    border:none;
    border-radius:12px;
    background:#0d47a1;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

button:hover{

    background:#082c6c;
    transform:scale(1.05);
}

/* CONTENEDOR HORIZONTAL */

.contenedor{

    display:flex;
    gap:20px;
    margin-top:20px;
}

/* RESULTADOS */

.resultados-panel{

    width:30%;
    background:#edf4ff;
    border-radius:18px;
    padding:20px;
    box-shadow:0px 2px 10px rgba(0,0,0,0.2);
}

.resultados-panel h2{

    text-align:center;
    color:#0d47a1;
}

.resultado{

    font-size:20px;
    line-height:2;
    color:#0d47a1;
    font-weight:bold;
}

/* GRÁFICA */

.grafica-panel{

    width:70%;
    background:#f7fbff;
    border-radius:18px;
    padding:15px;
    box-shadow:0px 2px 10px rgba(0,0,0,0.2);
}

#grafica{

    width:100%;
    height:750px;
}

/* RESPONSIVE */

@media(max-width:1100px){

    .contenedor{

        flex-direction:column;
    }

    .resultados-panel,
    .grafica-panel{

        width:100%;
    }
}

</style>

</head>

<body>

<header>

<h1>CÁLCULO INTEGRAL</h1>

<p>Calculadora Gráfica de Sumas de Riemann</p>

</header>

<div class="panel">

<div class="formulario">

<div class="campo">

<label>Función</label>

<input type="text" id="funcion" placeholder="Ejemplo: x*x">

</div>

<div class="campo">

<label>Extremo inferior (a)</label>

<input type="number" id="a" placeholder="a">

</div>

<div class="campo">

<label>Extremo superior (b)</label>

<input type="number" id="b" placeholder="b">

</div>

<div class="campo">

<label>Número de particiones (n)</label>

<input type="number" id="n" placeholder="n">

</div>

<div class="campo">

<label>Método</label>

<select id="metodo">

<option value="derecho">
Extremo derecho
</option>

<option value="izquierdo">
Extremo izquierdo
</option>

<option value="medio">
Punto medio
</option>

</select>

</div>

<div class="botones">

<button onclick="graficar()">
Calcular
</button>

<button onclick="descargarGrafica()">
Descargar gráfica
</button>

</div>

</div>

<!-- CONTENIDO -->

<div class="contenedor">

<!-- RESULTADOS -->

<div class="resultados-panel">

<h2>RESULTADOS</h2>

<div class="resultado" id="resultado">

Aquí aparecerán los resultados.

</div>

</div>

<!-- GRAFICA -->

<div class="grafica-panel">

<div id="grafica"></div>

</div>

</div>

</div>

<script>

function convertirFuncion(expr){

    expr = expr.replaceAll("ln","Math.log");
    expr = expr.replaceAll("sin","Math.sin");
    expr = expr.replaceAll("cos","Math.cos");
    expr = expr.replaceAll("tan","Math.tan");
    expr = expr.replaceAll("sqrt","Math.sqrt");

    return expr;
}

function convertirFormulaVisual(expr){

    let visual = expr;

    visual = visual.replaceAll("*","");

    visual = visual.replaceAll("xx","x²");

    visual = visual.replaceAll("x*x","x²");

    visual = visual.replaceAll("x*x*x","x³");

    return visual;
}

function f(x,expr){

    return eval(expr.replaceAll("x","("+x+")"));
}

function integralNumerica(expr,a,b){

    let pasos = 10000;

    let h = (b-a)/pasos;

    let total = 0;

    for(let i=0;i<pasos;i++){

        let x = a + i*h;

        total += f(x,expr)*h;
    }

    return total;
}

function graficar(){

    let exprOriginal = document.getElementById("funcion").value;

    let expr = convertirFuncion(exprOriginal);

    let formulaVisual = convertirFormulaVisual(exprOriginal);

    let a = parseFloat(document.getElementById("a").value);

    let b = parseFloat(document.getElementById("b").value);

    let n = parseInt(document.getElementById("n").value);

    let metodo = document.getElementById("metodo").value;

    let dx = (b-a)/n;

    let suma = 0;

    let datos = [];

    let x_func = [];
    let y_func = [];

    let xmin = a - Math.abs(b-a);
    let xmax = b + Math.abs(b-a);

    for(let x=xmin; x<=xmax; x+=0.01){

        try{

            x_func.push(x);

            y_func.push(f(x,expr));

        }catch{

        }
    }

    /* FUNCIÓN */

    datos.push({

        x:x_func,

        y:y_func,

        mode:"lines",

        line:{
            width:4,
            color:"#0d47a1"
        },

        name:"f(x)",

        showlegend:false
    });

    /* COLORES RECTÁNGULOS */

    let colores = [

        "#42a5f5",
        "#64b5f6",
        "#90caf9",
        "#1e88e5",
        "#5c6bc0",
        "#7986cb"
    ];

    /* RECTÁNGULOS */

    for(let i=0; i<n; i++){

        let xi;

        if(metodo=="derecho"){

            xi = a + (i+1)*dx;
        }

        else if(metodo=="izquierdo"){

            xi = a + i*dx;
        }

        else{

            xi = a + (i+0.5)*dx;
        }

        let altura = f(xi,expr);

        suma += altura*dx;

        let colorRect = colores[i % colores.length];

        datos.push({

            x:[
                a+i*dx,
                a+(i+1)*dx,
                a+(i+1)*dx,
                a+i*dx,
                a+i*dx
            ],

            y:[
                0,
                0,
                altura,
                altura,
                0
            ],

            fill:"toself",

            opacity:0.5,

            fillcolor:colorRect,

            line:{
                color:"#0d47a1"
            },

            type:"scatter",

            mode:"lines",

            showlegend:false
        });
    }

    let areaExacta = integralNumerica(expr,a,b);

    let error =

    Math.abs(

    (areaExacta - suma)/areaExacta

    )*100;

    let nombreMetodo = "";

    if(metodo=="derecho"){

        nombreMetodo = "Extremo derecho";
    }

    else if(metodo=="izquierdo"){

        nombreMetodo = "Extremo izquierdo";
    }

    else{

        nombreMetodo = "Punto medio";
    }

    let layout = {

        title:{

            text:"Visualización de la Suma de Riemann",

            font:{
                size:24,
                color:"#0d47a1"
            }
        },

        dragmode:"zoom",

        hovermode:"closest",

        plot_bgcolor:"#ffffff",

        paper_bgcolor:"#f7fbff",

        xaxis:{

            title:"Eje X",

            zeroline:true,

            showgrid:true,

            gridcolor:"#cfd8dc"
        },

        yaxis:{

            title:"Eje Y",

            zeroline:true,

            showgrid:true,

            gridcolor:"#cfd8dc"
        },

        showlegend:false,

        annotations:[

        {

            x:(a+b)/2,

            y:Math.max(...y_func),

            text:

            "f(x) = " +

            formulaVisual +

            "<br><br>" +

            "Área aproximada: " +

            suma.toFixed(4),

            showarrow:false,

            bgcolor:"#0d47a1",

            font:{
                size:18,
                color:"white"
            },

            borderpad:10
        }]
    };

    let config = {

        responsive:true,

        scrollZoom:true
    };

    Plotly.newPlot(

        "grafica",
        datos,
        layout,
        config
    );

    document.getElementById("resultado").innerHTML =

    "Método:<br>" +

    nombreMetodo +

    "<br><br>" +

    "Ancho de cada partición (Δx):<br>" +

    dx.toFixed(6)

    +

    "<br><br>" +

    "Área aproximada:<br>" +

    suma.toFixed(6)

    +

    "<br><br>" +

    "Área exacta:<br>" +

    areaExacta.toFixed(6)

    +

    "<br><br>" +

    "Error porcentual:<br>" +

    error.toFixed(4)

    +

    "%";
}

function descargarGrafica(){

    Plotly.downloadImage(

        "grafica",

        {

            format:"png",

            filename:"suma_riemann",

            height:800,

            width:1400
        }
    );
}

</script>

</body>

</html>
